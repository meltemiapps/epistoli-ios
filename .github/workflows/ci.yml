name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Swift packages, brand check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Matches the Swift in the macOS job's Xcode 26.6 (Swift 6.3.3).
    container: swift:6.3.3-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Brand check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/brand_check.sh
      - name: Test pure-Swift packages
        # SealedCrypto and SealedStorage are Apple-only (xcframework, Keychain, Secure Enclave); they run in the macOS job.
        run: swift test --package-path Packages/EpistoliCore

  macos:
    name: macOS (build and test app)
    # Standard GitHub-hosted runner, free for public repositories. Do not change to a -large/-xlarge runner (billed).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned so a runner image update can't change the toolchain silently. Xcode 26.6 = Swift 6.3.3.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: Bridge/go.sum
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test Go bridge
        working-directory: Bridge
        run: go test ./...
      - name: Bootstrap (GRDB+SQLCipher, GopenPGP xcframework, project)
        run: scripts/bootstrap.sh --strict
      - name: Test SealedCrypto
        run: swift test --package-path Packages/SealedCrypto
      - name: Test SealedStorage
        run: swift test --package-path Packages/SealedStorage
      - name: Build and test
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -I -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Epistoli.xcodeproj \
            -scheme Epistoli \
            -destination "id=$UDID" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          # Ad-hoc ("Sign to Run Locally") signing: no team or certificate, but the simulator grants the
          # Keychain entitlement the Keychain tests need (unsigned builds get errSecMissingEntitlement).
