name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Swift packages, brand check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Matches the Swift in the macOS job's Xcode 26.6 (Swift 6.3.3).
    container: swift:6.3.3-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Brand check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/brand_check.sh
      - name: Test Swift packages
        run: |
          for pkg in Packages/*/; do
            echo "::group::$pkg"
            swift test --package-path "$pkg"
            echo "::endgroup::"
          done

  macos:
    name: macOS (build and test app)
    # Standard GitHub-hosted runner, free for public repositories. Do not change to a -large/-xlarge runner (billed).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned so a runner image update can't change the toolchain silently. Xcode 26.6 = Swift 6.3.3.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -I -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Epistoli.xcodeproj \
            -scheme Epistoli \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
